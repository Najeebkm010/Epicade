<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | EpicEdge Media</title>
  <link rel="shortcut icon" href="assets/favicon/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-container {
      background-color: #fff;
      padding: 2rem 3rem;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 2rem;
    }
    .field {
      margin-bottom: 1.5rem;
    }
    .field label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .field input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .submit-btn {
      background-color: #c5a47e;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
    }
    .submit-btn:hover {
      background-color: #b3916b;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Admin Portal Login</h1>
    <form action="/login" method="POST">
      <div class="field"><label for="username">Username</label><input type="text" id="username" name="username" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" required></div>
      <button type="submit" class="submit-btn">Login</button>
    </form>
  </div>

</body>
</html>
