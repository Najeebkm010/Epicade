<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | EpicEdge Media</title>
  <link rel="shortcut icon" href="assets/favicon/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .admin-container {
      background-color: #fff;
      padding: 2rem 3rem;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 700px;
    }
    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .logout-link {
      font-size: 0.9rem;
      color: #c5a47e;
      text-decoration: none;
      font-weight: 500;
    }
    h1 {
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
    }
    p {
      text-align: center;
      color: #666;
      margin-top: 0;
      margin-bottom: 2.5rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .field {
      display: flex;
      flex-direction: column;
    }
    .field label {
      font-weight: 500;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .field input[type="file"] {
      border: 1px solid #ddd;
      padding: 0.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .submit-btn {
      grid-column: 1 / -1;
      background-color: #c5a47e;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 1.5rem;
      width: 100%;
    }
    .submit-btn:hover {
      background-color: #b3916b;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="header-flex">
      <h1>Portfolio Image Uploader</h1>
      <a href="/logout" class="logout-link">Logout</a>
    </div>
    <p>Upload new images to replace the ones on the portfolio page. The file names will be automatically updated.</p>
    <form action="/upload-portfolio" method="POST" enctype="multipart/form-data">
      <div class="form-grid">
        <div class="field"><label for="image1">Image 1</label><input type="file" id="image1" name="image1" accept="image/jpeg,.jpg,.jpeg"></div>
        <div class="field"><label for="image2">Image 2</label><input type="file" id="image2" name="image2" accept="image/jpeg,.jpg,.jpeg"></div>
        <div class="field"><label for="image3">Image 3</label><input type="file" id="image3" name="image3" accept="image/jpeg,.jpg,.jpeg"></div>
        <div class="field"><label for="image4">Image 4</label><input type="file" id="image4" name="image4" accept="image/jpeg,.jpg,.jpeg"></div>
        <div class="field"><label for="image5">Image 5</label><input type="file" id="image5" name="image5" accept="image/jpeg,.jpg,.jpeg"></div>
        <div class="field"><label for="image6">Image 6</label><input type="file" id="image6" name="image6" accept="image/jpeg,.jpg,.jpeg"></div>
        <div class="field"><label for="image7">Image 7</label><input type="file" id="image7" name="image7" accept="image/jpeg,.jpg,.jpeg"></div>
        <div class="field"><label for="image8">Image 8</label><input type="file" id="image8" name="image8" accept="image/jpeg,.jpg,.jpeg"></div>
        <div class="field"><label for="image9">Image 9</label><input type="file" id="image9" name="image9" accept="image/jpeg,.jpg,.jpeg"></div>
        <button type="submit" class="submit-btn">Upload and Replace Images</button>
      </div>
    </form>
  </div>

</body>
</html>
